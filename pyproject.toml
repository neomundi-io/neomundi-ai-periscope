[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neomundi-ai-periscope"
version = "1.0.0"
description = "NeoMundi AI Periscope Layer -- campaign, benchmark, baseline and evaluation engine on top of the NeoMundi Runtime Measurement Layer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = ["playwright>=1.40"]
pdf-weasyprint = ["weasyprint>=60"]
dev = ["pytest>=7.0"]

[project.scripts]
periscope = "periscope.cli:main"

[tool.setuptools.packages.find]
include = ["periscope*"]
